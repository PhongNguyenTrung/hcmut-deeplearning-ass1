name: 🧪 CI – Lint & Syntax Check

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'exercise_2/src/**'
      - 'notebooks/**'
      - 'exercise_2/notebooks/**'
      - 'requirements.txt'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Python Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install lint tools
        run: |
          pip install --upgrade pip
          pip install flake8 nbformat

      - name: 🔍 Flake8 – src/
        run: |
          flake8 src/ \
            --max-line-length=120 \
            --ignore=E501,W503,E203 \
            --exclude=__pycache__ \
            --statistics

      - name: 🔍 Flake8 – exercise_2/src/
        run: |
          flake8 exercise_2/src/ \
            --max-line-length=120 \
            --ignore=E501,W503,E203 \
            --exclude=__pycache__ \
            --statistics

      - name: 📓 Validate Jupyter Notebooks
        run: |
          python - <<'EOF'
          import json, sys, pathlib

          errors = []
          nb_dirs = [pathlib.Path("notebooks"), pathlib.Path("exercise_2/notebooks")]

          for nb_dir in nb_dirs:
              if not nb_dir.exists():
                  continue
              for nb_path in sorted(nb_dir.glob("*.ipynb")):
                  try:
                      with open(nb_path, "r", encoding="utf-8") as f:
                          nb = json.load(f)
                      assert "cells" in nb, "Missing 'cells' key"
                      assert "nbformat" in nb, "Missing 'nbformat' key"
                      print(f"  ✅ {nb_path} — {len(nb['cells'])} cells")
                  except Exception as e:
                      errors.append(f"  ❌ {nb_path}: {e}")

          if errors:
              print("\nNotebook validation errors:")
              for e in errors:
                  print(e)
              sys.exit(1)
          else:
              print("\nAll notebooks valid ✅")
          EOF

      - name: 📊 Report summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Python version**: 3.10" >> $GITHUB_STEP_SUMMARY
          echo "- **src/ files**: $(ls src/*.py 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **exercise_2/src/ files**: $(ls exercise_2/src/*.py 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Notebooks validated**: $(find notebooks exercise_2/notebooks -name '*.ipynb' 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY

  check-requirements:
    name: Validate requirements.txt
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🔍 Check requirements.txt
        run: |
          python -c "
          with open('requirements.txt') as f:
              lines = [l.strip() for l in f if l.strip() and not l.startswith('#')]
          print(f'requirements.txt: {len(lines)} packages listed')
          for line in lines:
              print(f'  - {line}')
          "
